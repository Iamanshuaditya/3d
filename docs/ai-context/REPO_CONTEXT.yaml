  optional: [ VORTEX_DEPLOYMENT_MODE, VORTEX_DATABASE, VORTEX_OBJECT_STORE, VORTEX_S3_ENDPOINT,
              VORTEX_S3_REGION, VORTEX_S3_BUCKET, VORTEX_S3_ACCESS_KEY_ID, VORTEX_S3_SECRET_ACCESS_KEY,
              VORTEX_EMBED_CLIENTS, VORTEX_BOOTSTRAP_OPERATOR_USER_IDS, VORTEX_ONBOARDING_PYTHON,
              VORTEX_ONBOARDING_TIMEOUT_MS, VORTEX_ENABLE_DEVELOPMENT_PRICING,
              VORTEX_GOLDEN_REFERENCE_PDF, VORTEX_POSTGRES_URL, VORTEX_POSTGRES_MAX_CONNECTIONS,
