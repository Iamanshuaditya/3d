  validated_at_startup: src/server/config/environment.ts

testing:
  runner: "node:test via tsx"
  command: npm test
  suites: 78
  tests_total: 484
  tests_pass: 475
  tests_skipped: 9              # postgres-integration, needs VORTEX_POSTGRES_TEST_URL
  coverage_tooling: none
  e2e: "scripts/smoke-deployment.mjs (Playwright), run by CI against the shipping artifact"
  uncovered:
    - "HTTP route handlers (no test imports src/app/api)"
    - "React components"
    - "useProjectSession autosave logic"
    - "src/proxy.ts middleware"
    - "S3 SigV4 signing vectors"

ci:
  workflows: [ .github/workflows/ci.yml, .github/workflows/structural-quality.yml ]
  services: [ "postgres:17 (for the 9 integration tests)" ]
  deploy_automation: none

high_risk_areas:
  - id: rate-limit-bypass
    severity: high
    summary: "withOwner mints a fresh guest identity for cookieless requests before assertRateLimit runs, so every per-owner limit is bypassable; no IP-based limiter exists."
    files: [ src/server/http/api.ts, src/server/auth/owner-context.ts, src/server/http/rate-limit.ts ]
  - id: rate-limit-table-growth
    severity: medium
    summary: "RateLimitStore.sweep() is never called outside tests; rate_limit_windows grows without bound."
    files: [ src/server/http/rate-limit-stores.ts ]
  - id: dormant-job-queue
    severity: medium
    summary: "background_jobs + JobWorker are complete but unused; the two live runners duplicate it less safely."
    files: [ src/platform/jobs/worker.ts, src/server/personalization/personalization-runner.ts, src/server/onboarding/onboarding-runner.ts ]
  - id: onboarding-no-recovery
    severity: medium
    summary: "An onboarding job interrupted by a restart stays 'running' forever; personalization recovers, onboarding does not."
    files: [ src/server/onboarding/container.ts ]
  - id: onboarding-missing-in-container
    severity: medium
    summary: "The Dockerfile runtime stage installs no Python and copies no product-onboarding/, so onboarding always fails in the reference image."
    files: [ Dockerfile ]
  - id: ready-endpoint-disclosure
    severity: medium
    summary: "/api/ready returns raw configuration and driver error text to anonymous callers."
    files: [ src/app/api/ready/route.ts ]
  - id: forwarded-header-trust
    severity: medium
    summary: "x-forwarded-host and x-forwarded-proto are trusted unconditionally by the same-origin check and by the HSTS/cookie decision."
    files: [ src/server/http/api.ts, src/server/http/request-security.ts ]
  - id: guest-claim-skips-quotes
    severity: low
    summary: "claimAll migrates projects, datasets and jobs but not price_quotes; guest quotes become unreachable."
    files: [ src/server/persistence/sqlite-project-repository.ts ]
  - id: postgres-fails-closed
    severity: acknowledged
    summary: "12 domain repositories and the Better Auth adapter are unported; VORTEX_DATABASE=postgresql refuses to start."
    files: [ src/server/persistence/backend.ts, docs/platform/POSTGRESQL.md ]
  - id: manufacturing-not-certified
    severity: acknowledged
    summary: "Reference recreation is certified; manufacturing construction is not, and requires converter evidence."
    files: [ quality-report.json ]

