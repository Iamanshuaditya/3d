name: Normalize Golden Fix Formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'verify/local-golden-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Normalize topology indentation and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/structure/topology.ts')
          text = path.read_text()
          start_marker = '  const holeEdgeKeys = new Set('
          end_marker = '  const panels: StructuralPanel[] = [];'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('golden topology patch anchors not found')
          replacement = '''  const holeEdgeKeys = new Set(
            holes.map((hole) => [...hole.edgeIds].sort().join("|")),
          );
          const candidateFaces = deduplicateFaces(graph.faces).filter((face) => {
            if (face.signedAreaMm2 <= EPSILON) return false;
            // A panel can legitimately surround a centered window. Using one interior
            // probe to reject faces inside holes incorrectly drops that panel whenever
            // the probe itself lands inside the nested cutout. Reject only the face
            // whose boundary is the actual cut-hole cycle; keep the surrounding panel
            // and attach the hole to it below.
            const edgeKey = [...face.edgeIds].sort().join("|");
            if (holeEdgeKeys.has(edgeKey)) return false;
            const probe = interiorProbe(face.points, tolerance);
            return pointInPolygon(probe, outer.points, tolerance);
          });

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git rm .github/workflows/fix-golden-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/structure/topology.ts
          git commit -m "style(structure): normalize centered-window fix"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
