name: Structural Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: structural-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VORTEX_ONBOARDING_PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: product-onboarding/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install onboarding dependencies
        run: python -m pip install -r product-onboarding/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
