name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Lets a required status check be re-run without pushing a commit.
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VORTEX_ONBOARDING_PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: product-onboarding/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install onboarding dependencies
        run: python -m pip install -r product-onboarding/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate onboarding manifests
        shell: bash
        run: |
          for manifest in product-onboarding/products/*/manifest.json; do
            product_dir="${manifest%/manifest.json}"
            echo "Validating ${product_dir}"
            python product-onboarding/onboard.py validate "${product_dir}"
          done

      - name: Build
        run: npm run build

  deployment:
    name: deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for the smoke test
        run: npx playwright install --with-deps chromium

      # CI must build the artifact that actually ships, not a different one.
      - name: Build supported production artifact
        run: |
          npm run build
          npm run build:standalone

      - name: Start the artifact
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: 127.0.0.1
          VORTEX_DATA_DIR: ${{ runner.temp }}/vortex-data
          VORTEX_AUTH_URL: https://ci.invalid
        run: |
          mkdir -p "$VORTEX_DATA_DIR"
          SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          VORTEX_AUTH_SECRET="$SECRET" \
          VORTEX_GUEST_COOKIE_SECRET="$SECRET" \
          nohup node .next/standalone/server.js > "${{ runner.temp }}/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          echo "The artifact did not become healthy."
          cat "${{ runner.temp }}/server.log"
          exit 1

      # A build that compiles and a deployment that works are different claims.
      - name: Smoke test the running deployment
        run: npm run smoke:deployment -- http://127.0.0.1:3000

      - name: Server log on failure
        if: failure()
        run: cat "${{ runner.temp }}/server.log" || true
