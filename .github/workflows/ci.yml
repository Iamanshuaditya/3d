name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Lets a required status check be re-run without pushing a commit.
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VORTEX_ONBOARDING_PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: product-onboarding/requirements.txt

      - name: Verify generated files are in sync
        shell: bash
        run: |
          bash scripts/sync-agent-rules.sh
          node scripts/sync-skills.mjs

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Generated files are out of sync with their sources (AGENTS.md / SKILL.md)."
            echo "Run the sync scripts locally and commit the result:"
            echo "  bash scripts/sync-agent-rules.sh"
            echo "  node scripts/sync-skills.mjs"
            git status --short
            git diff --stat
            exit 1
          fi
          echo "All generated files are in sync with their sources."

      - name: Install dependencies
        run: npm ci

      - name: Install onboarding dependencies
        run: python -m pip install -r product-onboarding/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate onboarding manifests
        shell: bash
        run: |
          for manifest in product-onboarding/products/*/manifest.json; do
            product_dir="${manifest%/manifest.json}"
            echo "Validating ${product_dir}"
            python product-onboarding/onboard.py validate "${product_dir}"
          done

      - name: Build
        run: npm run build
