name: Apply Golden Private-Run Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'verify/local-golden-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply private-run regressions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['type'] = 'module'
          package.write_text(json.dumps(data, indent=2) + '\n')

          topology = Path('src/lib/structure/topology.ts')
          text = topology.read_text()
          old = '''  const candidateFaces = deduplicateFaces(graph.faces).filter((face) => {
            if (face.signedAreaMm2 <= EPSILON) return false;
            const probe = interiorProbe(face.points, tolerance);
            return (
              pointInPolygon(probe, outer.points, tolerance) &&
              !holes.some((hole) => pointInPolygon(probe, hole.points, tolerance))
            );
          });
          '''
          new = '''  const holeEdgeKeys = new Set(
            holes.map((hole) => [...hole.edgeIds].sort().join("|")),
          );
          const candidateFaces = deduplicateFaces(graph.faces).filter((face) => {
            if (face.signedAreaMm2 <= EPSILON) return false;
            // A panel can legitimately surround a centered window. Using one interior
            // probe to reject faces inside holes incorrectly drops that panel whenever
            // the probe itself lands inside the nested cutout. Reject only the face
            // whose boundary is the actual cut-hole cycle; keep the surrounding panel
            // and attach the hole to it below.
            const edgeKey = [...face.edgeIds].sort().join("|");
            if (holeEdgeKeys.has(edgeKey)) return false;
            const probe = interiorProbe(face.points, tolerance);
            return pointInPolygon(probe, outer.points, tolerance);
          });
          '''
          if old not in text:
              raise SystemExit('expected topology block not found')
          topology.write_text(text.replace(old, new, 1))

          test_file = Path('tests/structure/topology.test.ts')
          tests = test_file.read_text()
          anchor = 'test("individually stroked PDF-style cut edges reconstruct one outer cycle and nested window", () => {'
          regression = '''test("a centered structural window does not erase its owning panel", () => {
            const dieline: CanonicalDieline = {
              ...fixture(),
              id: "centered-window-single-panel",
              widthMm: 100,
              heightMm: 100,
              entities: [
                linePathEntity(
                  "outer-cut",
                  "cut",
                  [
                    { x: 0, y: 0 },
                    { x: 100, y: 0 },
                    { x: 100, y: 100 },
                    { x: 0, y: 100 },
                  ],
                  true,
                ),
                linePathEntity(
                  "centered-window",
                  "window-cut",
                  [
                    { x: 40, y: 40 },
                    { x: 60, y: 40 },
                    { x: 60, y: 60 },
                    { x: 40, y: 60 },
                  ],
                  true,
                ),
              ],
            };

            const graph = buildPlanarGraph(dieline);
            const panels = extractStructuralPanels(dieline, graph);
            assert.equal(panels.length, 1);
            assert.equal(panels[0].holes.length, 1);
            assert.equal(panels[0].holes[0].length, 4);
          });

          '''
          if regression.splitlines()[0] in tests:
              raise SystemExit('centered-window regression already present')
          if anchor not in tests:
              raise SystemExit('topology test anchor not found')
          test_file.write_text(tests.replace(anchor, regression + anchor, 1))
          PY

          git rm .github/workflows/golden-local-transport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/lib/structure/topology.ts tests/structure/topology.test.ts
          git commit -m "fix(structure): pass real golden source acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
