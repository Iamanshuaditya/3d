name: Apply Validated Golden Orientation Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'verify/golden-reference-orientation-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply validated local corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          body = Path('src/lib/structure/golden-body-tube.ts')
          text = body.read_text()
          start = text.index('  const rootPanelId = window.panelId;')
          end = text.index('  const gates = {', start)
          lines = [
            '  // The reference keeps the plain broad body panel as the stationary floor',
            '  // while the narrow side, window-bearing broad wall, and opposite side fold',
            '  // around it. This root choice is presentation-observable and removes the',
            '  // previous mirror-equivalent-but-visually-wrong window-floor construction.',
            '  const rootPanelId = broad.panelId;',
            '  const directed: GoldenBodyHingeDefinition[] = [',
            '    {',
            '      roleId: hinges[1].id,',
            '      parentPanelId: rootPanelId,',
            '      childPanelId: narrowLeft.panelId,',
            '      assembledAngleDeg: 90 * sign,',
            '      source: hinges[1].source,',
            '      evidence: "CANONICAL_RECTANGULAR_TUBE_RECONSTRUCTION_UP_TO_GLOBAL_MIRROR",',
            '    },',
            '    {',
            '      roleId: hinges[2].id,',
            '      parentPanelId: narrowLeft.panelId,',
            '      childPanelId: window.panelId,',
            '      assembledAngleDeg: 90 * sign,',
            '      source: hinges[2].source,',
            '      evidence: "CANONICAL_RECTANGULAR_TUBE_RECONSTRUCTION_UP_TO_GLOBAL_MIRROR",',
            '    },',
            '    {',
            '      roleId: hinges[3].id,',
            '      parentPanelId: window.panelId,',
            '      childPanelId: narrowRight.panelId,',
            '      assembledAngleDeg: 90 * sign,',
            '      source: hinges[3].source,',
            '      evidence: "CANONICAL_RECTANGULAR_TUBE_RECONSTRUCTION_UP_TO_GLOBAL_MIRROR",',
            '    },',
            '    {',
            '      roleId: hinges[0].id,',
            '      parentPanelId: rootPanelId,',
            '      childPanelId: seam.panelId,',
            '      assembledAngleDeg: -90 * sign,',
            '      source: hinges[0].source,',
            '      evidence: "CANONICAL_RECTANGULAR_TUBE_RECONSTRUCTION_UP_TO_GLOBAL_MIRROR",',
            '    },',
            '  ];',
            '',
            '  const wSeam = seam.widthMm;',
            '  const wBack = broad.widthMm;',
            '  const wLeft = narrowLeft.widthMm;',
            '  const wFront = window.widthMm;',
            '  const wRight = narrowRight.widthMm;',
            '',
            "  // Canonical strip x positions relative to the plain broad panel's left edge.",
            '  const xBroadLeft = 0;',
            '  const xBroadRight = wBack;',
            '  const xNarrowLeftFar = wBack + wLeft;',
            '  const xWindowFar = wBack + wLeft + wFront;',
            '  const xNarrowRightFar = wBack + wLeft + wFront + wRight;',
            '  const xSeamFar = -wSeam;',
            '',
            '  const root = identity();',
            '  const narrowLeftTransform = compose(root, rotateAboutSheetX(xBroadRight, 90 * sign));',
            '  const windowTransform = compose(narrowLeftTransform, rotateAboutSheetX(xNarrowLeftFar, 90 * sign));',
            '  const narrowRightTransform = compose(windowTransform, rotateAboutSheetX(xWindowFar, 90 * sign));',
            '  const seamTransform = compose(root, rotateAboutSheetX(xBroadLeft, -90 * sign));',
            '',
            '  const frontLeft = apply(root, { x: xBroadLeft, depth: 0 });',
            '  const frontRight = apply(root, { x: xBroadRight, depth: 0 });',
            '  const backLeft = apply(narrowLeftTransform, { x: xNarrowLeftFar, depth: 0 });',
            '  const backRightFromBackPanel = apply(windowTransform, { x: xWindowFar, depth: 0 });',
            '  const backRightFromSidePanel = apply(narrowRightTransform, { x: xNarrowRightFar, depth: 0 });',
            '  const seamInner = apply(seamTransform, { x: xSeamFar, depth: 0 });',
            '',
            '  const closureGapMm = distance(frontLeft, backRightFromSidePanel);',
            '  const seamLineErrorMm = pointLineDistance(seamInner, backRightFromSidePanel, backRightFromBackPanel);',
            '  const seamFraction = projectionFraction(seamInner, backRightFromSidePanel, backRightFromBackPanel);',
            '  const frontAxis = vector(frontLeft, frontRight);',
            '  const sideAxis = vector(frontRight, backLeft);',
            '  const orthogonalityError = Math.abs(dot(frontAxis, sideAxis)) /',
            '    Math.max(Number.EPSILON, Math.hypot(frontAxis.x, frontAxis.depth) * Math.hypot(sideAxis.x, sideAxis.depth));',
            '',
          ]
          body.write_text(text[:start] + '\n'.join(lines) + '\n' + text[end:])

          reviewed = Path('src/lib/structure/golden-reviewed-construction.ts')
          text = reviewed.read_text()
          start = text.index('  // The canonical sheet lies in X/Z.')
          end = text.index('\n\n  return {', start)
          replacement = '\n'.join([
            '  // Presentation orientation is deliberately independent from physical fold',
            '  // semantics. The benchmark reference keeps the canonical flat sheet in the',
            '  // horizontal X/Z plane, so no global model rotation is applied here.',
            '  const modelRotationRad: readonly [number, number, number] = [0, 0, 0];',
          ])
          reviewed.write_text(text[:start] + replacement + text[end:])

          test = Path('tests/structure/golden-body-tube.test.ts')
          text = test.read_text()
          replacements = {
            'assert.equal(report.rootPanelId, "front-window");': 'assert.equal(report.rootPanelId, "back");',
            'assert.ok(Math.abs(report.corners.backLeft.depth + 150) <= 1e-9);': 'assert.ok(Math.abs(Math.abs(report.corners.backLeft.depth) - 150) <= 1e-9);',
            'assert.ok(Math.abs(report.corners.backRightFromBackPanel.x - 200) <= 1e-9);': 'assert.ok(Math.abs(report.corners.backRightFromBackPanel.x) <= 1e-9);',
            'assert.ok(report.corners.seamInner.depth > report.corners.backRightFromBackPanel.depth);': 'assert.ok(Math.abs(report.corners.seamInner.depth) < Math.abs(report.corners.backRightFromBackPanel.depth));',
          }
          for old, new in replacements.items():
              if old not in text: raise SystemExit(f'missing body test anchor: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text)

          test = Path('tests/structure/golden-reference-recreation.test.ts')
          text = test.read_text()
          for old, new in [
            ('assert.equal(compiled.construction.rootPanelId, "window");', 'assert.equal(compiled.construction.rootPanelId, "plain");'),
            ('assert.deepEqual(compiled.modelRotationRad, [Math.PI / 2, 0, 0]);', 'assert.deepEqual(compiled.modelRotationRad, [0, 0, 0]);'),
          ]:
              if old not in text: raise SystemExit(f'missing recreation test anchor: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text)

          test = Path('tests/structure/golden-reviewed-construction.test.ts')
          text = test.read_text()
          for old, new in [
            ('assert.equal(compiled.construction.rootPanelId, "front-window");', 'assert.equal(compiled.construction.rootPanelId, "back");'),
            ('assert.deepEqual(compiled.modelRotationRad, [Math.PI / 2, 0, 0]);', 'assert.deepEqual(compiled.modelRotationRad, [0, 0, 0]);'),
          ]:
              if old not in text: raise SystemExit(f'missing reviewed test anchor: {old}')
              text = text.replace(old, new, 1)
          block_start = text.index('  const body = new Map(compiled.construction.hinges.map((hinge) => [hinge.id, hinge]));')
          block_end = text.index('\n});', block_start)
          block = '\n'.join([
            '  const body = new Map(compiled.construction.hinges.map((hinge) => [hinge.id, hinge]));',
            '  assert.equal(body.get("body-1")?.parentPanelId, "back");',
            '  assert.equal(body.get("body-1")?.childPanelId, "left");',
            '  assert.equal(body.get("body-1")?.assembledAngleDeg, 90);',
            '  assert.equal(body.get("body-2")?.parentPanelId, "left");',
            '  assert.equal(body.get("body-2")?.childPanelId, "front-window");',
            '  assert.equal(body.get("body-2")?.assembledAngleDeg, 90);',
            '  assert.equal(body.get("body-3")?.parentPanelId, "front-window");',
            '  assert.equal(body.get("body-3")?.childPanelId, "right");',
            '  assert.equal(body.get("body-3")?.assembledAngleDeg, 90);',
            '  assert.equal(body.get("body-0")?.parentPanelId, "back");',
            '  assert.equal(body.get("body-0")?.childPanelId, "seam");',
            '  assert.equal(body.get("body-0")?.assembledAngleDeg, -90);',
          ])
          text = text[:block_start] + block + text[block_end:]
          text = text.replace('/(more than one reviewed parent|no reviewed parent|cycle)/', '/(root panel|more than one reviewed parent|no reviewed parent|cycle)/')
          test.write_text(text)
          PY

          git rm .github/workflows/apply-golden-orientation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/structure/golden-body-tube.ts src/lib/structure/golden-reviewed-construction.ts tests/structure/golden-body-tube.test.ts tests/structure/golden-reference-recreation.test.ts tests/structure/golden-reviewed-construction.test.ts
          git commit -m "fix(structure): align golden body orientation with reference"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
