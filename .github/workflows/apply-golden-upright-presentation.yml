name: Apply Golden Upright Presentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'verify/golden-reference-orientation-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Keep plain root but restore upright product presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reviewed = Path('src/lib/structure/golden-reviewed-construction.ts')
          text = reviewed.read_text()
          old = '''  // Presentation orientation is deliberately independent from physical fold
          // semantics. The benchmark reference keeps the canonical flat sheet in the
          // horizontal X/Z plane, so no global model rotation is applied here.
          const modelRotationRad: readonly [number, number, number] = [0, 0, 0];
          '''
          new = '''  // Product presentation orientation is independent from fold state and camera.
          // The certified broad body root is an upright wall in the assembled carton;
          // the reviewed physical-top convention selects which sheet side points up.
          const modelRotationRad: readonly [number, number, number] = [
            reviewed.physicalTop === "north" ? Math.PI / 2 : -Math.PI / 2,
            0,
            0,
          ];
          '''
          if old not in text:
              raise SystemExit('model-rotation block not found')
          reviewed.write_text(text.replace(old, new, 1))

          for filename in [
              'tests/structure/golden-reference-recreation.test.ts',
              'tests/structure/golden-reviewed-construction.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              old_assert = 'assert.deepEqual(compiled.modelRotationRad, [0, 0, 0]);'
              new_assert = 'assert.deepEqual(compiled.modelRotationRad, [Math.PI / 2, 0, 0]);'
              if old_assert not in text:
                  raise SystemExit(f'model-rotation expectation not found in {filename}')
              path.write_text(text.replace(old_assert, new_assert, 1))
          PY

          git rm .github/workflows/apply-golden-upright-presentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/structure/golden-reviewed-construction.ts tests/structure/golden-reference-recreation.test.ts tests/structure/golden-reviewed-construction.test.ts
          git commit -m "fix(structure): keep golden carton upright independently of camera"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
