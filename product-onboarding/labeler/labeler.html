<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Region Labeler</title>
<style>
  body { margin: 0; font-family: Helvetica, sans-serif; display: flex; height: 100vh; }
  #side { width: 340px; padding: 12px; overflow-y: auto; border-right: 1px solid #ddd; background: #fafafa; }
  #view { flex: 1; position: relative; }
  #view canvas { display: block; }
  h2 { font-size: 15px; margin: 8px 0 6px; }
  .node { padding: 3px 6px; cursor: pointer; border-radius: 3px; font-size: 12px; font-family: Menlo, monospace; }
  .node:hover { background: #eee; }
  .node.selected { background: #ffd9a0; }
  .node.assigned { color: #999; text-decoration: line-through; }
  .region { border: 1px solid #ccc; border-radius: 4px; padding: 6px 8px; margin: 6px 0; font-size: 12px; background: #fff; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  select, input { font-size: 12px; margin: 2px 0; }
  #mode { position: absolute; top: 10px; left: 10px; background: #fff9; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
  label { display: block; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="side">
  <h2>1 · Meshes (click to select)</h2>
  <div id="nodes"></div>
  <h2>2 · Face paint (single-mesh products)</h2>
  <label><input type="checkbox" id="paintMode"> paint faces on active mesh (drag)</label>
  <label>brush px <input type="range" id="brush" min="5" max="80" value="25"></label>
  <button id="clearPaint">clear painted</button>
  <span id="paintCount" style="font-size:11px"></span>
  <h2>3 · Create region</h2>
  <input id="rlabel" placeholder="Label e.g. Body Wrap" style="width:95%">
  <label>strategy
    <select id="rstrategy">
      <option value="wrap">wrap</option>
      <option value="planar">planar</option>
      <option value="reuse_existing">reuse_existing</option>
    </select>
    axis
    <select id="raxis"><option>y</option><option>x</option><option>z</option></select>
  </label>
  <label><input type="checkbox" id="rcust" checked> customizable</label>
  <label><input type="checkbox" id="rflipu"> flip_u <input type="checkbox" id="rflipv"> flip_v
    · seam° <input id="rseam" type="number" value="180" style="width:52px"> (wrap only)</label>
  <span style="font-size:11px;color:#777">Unsure about flips? Leave off — the validator's
  chirality check tells you which to toggle.</span>
  <button id="addRegion">Add region from selection</button>
  <h2>4 · Regions</h2>
  <div id="regions"></div>
  <button id="addRest">Add "everything else" (non-customizable)</button>
  <h2>5 · Export</h2>
  <input id="pid" placeholder="product id e.g. mug-001" style="width:95%">
  <input id="pname" placeholder="product name" style="width:95%">
  <label>physical: extent
    <select id="paxis"><option>x</option><option>y</option><option>z</option></select>
    = <input id="pcm" type="number" value="10" style="width:60px"> cm
  </label>
  <button id="export">Download manifest.json</button>
</div>
<div id="view"><div id="mode">orbit: drag · select: click</div></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const params = new URLSearchParams(location.search);
const modelUrl = params.get("model");

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(view.clientWidth, view.clientHeight);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f2);
scene.add(new THREE.AmbientLight(0xffffff, 2.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.6);
dl.position.set(2, 3, 4);
scene.add(dl);

const gltf = await new GLTFLoader().loadAsync(modelUrl);
scene.add(gltf.scene);
const meshes = [];
gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });

const box = new THREE.Box3().setFromObject(gltf.scene);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3()).length();
const cam = new THREE.PerspectiveCamera(40, view.clientWidth / view.clientHeight, size / 100, size * 20);
cam.position.copy(center).add(new THREE.Vector3(size * 0.7, size * 0.5, size));
const controls = new OrbitControls(cam, renderer.domElement);
controls.target.copy(center);

// ---------------- selection state
const selected = new Set();       // mesh names selected for the next region
const assigned = new Set();       // names already claimed by a region
const painted = new Map();        // meshName -> Set(faceIndex)
const regions = [];

const baseEmissive = new Map();
for (const m of meshes) {
  m.material = m.material.clone();
  baseEmissive.set(m.name, m.material.emissive?.clone() ?? new THREE.Color(0));
}
function refreshHighlights() {
  for (const m of meshes) {
    if (!m.material.emissive) continue;
    if (selected.has(m.name)) m.material.emissive.setHex(0xff8800);
    else if (assigned.has(m.name)) m.material.emissive.setHex(0x113311);
    else m.material.emissive.copy(baseEmissive.get(m.name));
  }
  document.querySelectorAll(".node").forEach(el => {
    el.classList.toggle("selected", selected.has(el.dataset.name));
    el.classList.toggle("assigned", assigned.has(el.dataset.name));
  });
}

const nodesEl = document.getElementById("nodes");
for (const m of meshes) {
  const el = document.createElement("div");
  el.className = "node";
  el.dataset.name = m.name;
  el.textContent = `${m.name}  (${m.geometry.index ? m.geometry.index.count / 3 : m.geometry.attributes.position.count / 3} tris)`;
  el.onclick = () => { selected.has(m.name) ? selected.delete(m.name) : selected.add(m.name); refreshHighlights(); };
  nodesEl.appendChild(el);
}

// ---------------- picking / painting
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let painting = false;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, cam);
  return ray.intersectObjects(meshes, true)[0];
}
const paintHelpers = new Map();  // meshName -> {colorAttr}
function ensurePaintable(mesh) {
  if (paintHelpers.has(mesh.name)) return paintHelpers.get(mesh.name);
  const g = mesh.geometry = mesh.geometry.toNonIndexed();
  const n = g.attributes.position.count;
  const colors = new Float32Array(n * 3).fill(1);
  g.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  mesh.material.vertexColors = true;
  mesh.material.needsUpdate = true;
  const h = { colors: g.attributes.color };
  paintHelpers.set(mesh.name, h);
  return h;
}
function paintAt(ev) {
  const hit = pick(ev);
  if (!hit) return;
  const mesh = hit.object;
  const h = ensurePaintable(mesh);
  const set = painted.get(mesh.name) ?? painted.set(mesh.name, new Set()).get(mesh.name);
  // brush: all faces whose screen-projected centroid is within brush px
  const brushPx = +document.getElementById("brush").value;
  const rect = renderer.domElement.getBoundingClientRect();
  const pos = mesh.geometry.attributes.position;
  const v = new THREE.Vector3();
  const nFaces = pos.count / 3;
  const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
  const toCam = new THREE.Vector3();
  for (let f = 0; f < nFaces; f++) {
    a.fromBufferAttribute(pos, f * 3).applyMatrix4(mesh.matrixWorld);
    b.fromBufferAttribute(pos, f * 3 + 1).applyMatrix4(mesh.matrixWorld);
    c.fromBufferAttribute(pos, f * 3 + 2).applyMatrix4(mesh.matrixWorld);
    v.copy(a).add(b).add(c).multiplyScalar(1 / 3);
    // Only faces FACING the camera get painted — prevents painting through
    // the model onto hidden back-side geometry.
    n.crossVectors(ab.subVectors(b, a), ac.subVectors(c, a));
    toCam.subVectors(cam.position, v);
    if (n.dot(toCam) <= 0) continue;
    v.project(cam);
    const sx = (v.x + 1) / 2 * rect.width, sy = (1 - v.y) / 2 * rect.height;
    if ((sx - cx) ** 2 + (sy - cy) ** 2 < brushPx * brushPx && v.z < 1) {
      set.add(f);
      for (let k = 0; k < 3; k++) h.colors.setXYZ(f * 3 + k, 1, 0.45, 0.1);
    }
  }
  h.colors.needsUpdate = true;
  document.getElementById("paintCount").textContent =
    [...painted].map(([n, s]) => `${n}:${s.size}`).join("  ");
}
renderer.domElement.addEventListener("pointerdown", ev => {
  if (document.getElementById("paintMode").checked) { painting = true; controls.enabled = false; paintAt(ev); }
});
renderer.domElement.addEventListener("pointermove", ev => { if (painting) paintAt(ev); });
addEventListener("pointerup", () => { painting = false; controls.enabled = true; });
renderer.domElement.addEventListener("click", ev => {
  if (document.getElementById("paintMode").checked) return;
  const hit = pick(ev);
  if (!hit) return;
  const n = hit.object.name;
  selected.has(n) ? selected.delete(n) : selected.add(n);
  refreshHighlights();
});
document.getElementById("clearPaint").onclick = () => {
  for (const [name, h] of paintHelpers) {
    for (let i = 0; i < h.colors.count; i++) h.colors.setXYZ(i, 1, 1, 1);
    h.colors.needsUpdate = true;
  }
  painted.clear();
  document.getElementById("paintCount").textContent = "";
};

// ---------------- regions
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); }
const regionsEl = document.getElementById("regions");
function renderRegions() {
  regionsEl.innerHTML = "";
  for (const r of regions) {
    const el = document.createElement("div");
    el.className = "region";
    const sel = r.select.by === "faces"
      ? `${r.select.node}: ${r.select.faces.length} painted faces`
      : r.select.by === "rest" ? "everything else" : r.select.nodes.join(", ");
    el.innerHTML = `<b>${r.label}</b> — ${r.customizable ? (r.strategy.type + "/" + (r.strategy.axis ?? "")) : "not customizable"}<br>${sel} `;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.onclick = () => {
      regions.splice(regions.indexOf(r), 1);
      (r.select.nodes ?? []).forEach(n => assigned.delete(n));
      renderRegions(); refreshHighlights();
    };
    el.appendChild(del);
    regionsEl.appendChild(el);
  }
}
document.getElementById("addRegion").onclick = () => {
  const label = document.getElementById("rlabel").value.trim();
  if (!label) return alert("Give the region a label");
  const customizable = document.getElementById("rcust").checked;
  const strategy = { type: document.getElementById("rstrategy").value,
                     axis: document.getElementById("raxis").value };
  if (document.getElementById("rflipu").checked) strategy.flip_u = true;
  if (document.getElementById("rflipv").checked) strategy.flip_v = true;
  if (strategy.type === "wrap") strategy.seam_deg = +document.getElementById("rseam").value;
  let select;
  if (painted.size) {
    if (painted.size > 1) alert("Faces painted on multiple meshes; using the first — create one region per mesh.");
    const [node, faces] = [...painted.entries()][0];
    select = { by: "faces", node, faces: [...faces].sort((a, b) => a - b) };
    painted.clear();
    document.getElementById("paintCount").textContent = "";
  } else if (selected.size) {
    select = { by: "nodes", nodes: [...selected] };
    for (const n of selected) assigned.add(n);
    selected.clear();
  } else return alert("Select meshes or paint faces first");
  regions.push({ id: slug(label), label, customizable,
                 meshName: slug(label).toUpperCase(),
                 select, ...(customizable ? { strategy } : {}) });
  renderRegions(); refreshHighlights();
};
document.getElementById("addRest").onclick = () => {
  regions.push({ id: "rest", label: "Everything else", customizable: false, select: { by: "rest" } });
  renderRegions();
};
document.getElementById("export").onclick = () => {
  const manifest = {
    id: document.getElementById("pid").value || "product-000",
    name: document.getElementById("pname").value || "Unnamed product",
    source: "source.glb",
    physical: { reference: { extent: document.getElementById("paxis").value,
                             cm: +document.getElementById("pcm").value } },
    template: { pxPerCm: 40 },
    modelYOffset: 0,
    regions: regions.map(r => ({ ...r })),
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(manifest, null, 2)], { type: "application/json" }));
  a.download = "manifest.json";
  a.click();
};

(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, cam); })();
window.__ready = true;
</script>
</body>
</html>
