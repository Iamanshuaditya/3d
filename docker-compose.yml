# Reference single-node deployment (#26).
#
# One app process, SQLite and uploads on one persistent volume. This is the
# supported V1 shape; see docs/platform/DEPLOYMENT.md before scaling out.
services:
  vortex:
    build: .
    image: vortex:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      VORTEX_DEPLOYMENT_MODE: single-node
      VORTEX_DATABASE: sqlite
      VORTEX_OBJECT_STORE: filesystem
      VORTEX_DATA_DIR: /data
      # Required. Generate each with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      VORTEX_AUTH_SECRET: ${VORTEX_AUTH_SECRET:?set VORTEX_AUTH_SECRET}
      VORTEX_GUEST_COOKIE_SECRET: ${VORTEX_GUEST_COOKIE_SECRET:?set VORTEX_GUEST_COOKIE_SECRET}
      # The public https origin this deployment is served from.
      VORTEX_AUTH_URL: ${VORTEX_AUTH_URL:?set VORTEX_AUTH_URL}
      # Optional: embedded configurator clients. See docs/platform/EMBED.md.
      VORTEX_EMBED_CLIENTS: ${VORTEX_EMBED_CLIENTS:-}
    volumes:
      - vortex-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vortex-data:
